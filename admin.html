<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — TMP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<header class="kopf">
  <div class="container">
    <a class="wortmarke" href="index.html"><span class="paragraf">§</span> TMP <small>Tommy Möller Partei</small></a>
    <nav class="hauptnav" aria-label="Hauptnavigation">
      <ul>
        <li><a href="index.html">Start</a></li>
        <li><a href="themen.html">Themen</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="zahlen.html">Zahlen</a></li>
        <li><a href="aktuelles.html">Aktuelles</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="abschnitt" id="login-bereich">
    <form class="admin-login" id="login-formular">
      <h2>Admin-Login</h2>
      <label for="login-email">E-Mail</label>
      <input type="email" id="login-email" required>
      <label for="login-passwort">Passwort</label>
      <input type="password" id="login-passwort" required>
      <button type="submit" class="knopf">Anmelden</button>
      <div class="status-meldung" id="login-status"></div>
    </form>
  </section>

  <section class="abschnitt" id="admin-bereich" style="display:none;">
    <div class="admin-kopf">
      <h2>Admin</h2>
      <button class="knopf leer" id="logout-knopf">Abmelden</button>
    </div>

    <div class="admin-tabs">
      <button class="aktiv" data-tab="produkte">Shop-Produkte</button>
      <button data-tab="themen">Themen</button>
      <button data-tab="blog">Aktuelles</button>
      <button data-tab="mitglieder">Mitglieder</button>
      <button data-tab="kennzahlen">Kennzahlen</button>
    </div>

    <!-- ===================== SHOP-PRODUKTE ===================== -->
    <div class="admin-panel aktiv" id="panel-produkte">
      <div class="admin-formular">
        <h3 id="produkt-formular-titel">Neues Produkt</h3>
        <input type="hidden" id="produkt-id">
        <label for="produkt-name">Name</label>
        <input type="text" id="produkt-name" required>
        <label for="produkt-beschreibung">Beschreibung</label>
        <textarea id="produkt-beschreibung"></textarea>
        <label for="produkt-preis">Preis (€)</label>
        <input type="number" id="produkt-preis" step="0.01" min="0" required>
        <label for="produkt-bild">Bild</label>
        <input type="file" id="produkt-bild" accept="image/*">
        <label for="produkt-reihenfolge">Reihenfolge (kleinere Zahl zuerst)</label>
        <input type="number" id="produkt-reihenfolge" value="0">
        <div class="feld-checkbox">
          <input type="checkbox" id="produkt-aktiv" checked>
          <label for="produkt-aktiv" style="margin:0;">Im Shop sichtbar</label>
        </div>
        <div class="knopf-zeile">
          <button class="knopf" id="produkt-speichern">Speichern</button>
          <button class="knopf leer" id="produkt-abbrechen" style="display:none;">Abbrechen</button>
        </div>
        <div class="status-meldung" id="produkt-status"></div>
      </div>
      <ul class="admin-liste" id="produkt-liste"></ul>
    </div>

    <!-- ===================== THEMEN ===================== -->
    <div class="admin-panel" id="panel-themen">
      <div class="admin-formular">
        <h3 id="hauptpunkt-formular-titel">Neuer Hauptpunkt</h3>
        <input type="hidden" id="hauptpunkt-id">
        <label for="hauptpunkt-titel">Titel (z. B. „Wirtschaft &amp; Finanzen")</label>
        <input type="text" id="hauptpunkt-titel" required>
        <label for="hauptpunkt-slug">Slug (für die URL, z. B. „wirtschaft-finanzen")</label>
        <input type="text" id="hauptpunkt-slug" required>
        <label for="hauptpunkt-kurztext">Kurztext (auf der Themen-Übersicht)</label>
        <textarea id="hauptpunkt-kurztext"></textarea>
        <label for="hauptpunkt-bild">Bild</label>
        <input type="file" id="hauptpunkt-bild" accept="image/*">
        <label for="hauptpunkt-dokument">Dokument (PDF, Word, ...) — z. B. das Wahlprogramm-Kapitel</label>
        <input type="file" id="hauptpunkt-dokument" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <label for="hauptpunkt-reihenfolge">Reihenfolge</label>
        <input type="number" id="hauptpunkt-reihenfolge" value="0">
        <div class="feld-checkbox">
          <input type="checkbox" id="hauptpunkt-veroeffentlicht" checked>
          <label for="hauptpunkt-veroeffentlicht" style="margin:0;">Veröffentlicht</label>
        </div>
        <div class="knopf-zeile">
          <button class="knopf" id="hauptpunkt-speichern">Speichern</button>
          <button class="knopf leer" id="hauptpunkt-abbrechen" style="display:none;">Abbrechen</button>
        </div>
        <div class="status-meldung" id="hauptpunkt-status"></div>
      </div>
      <ul class="admin-liste" id="hauptpunkt-liste"></ul>
    </div>

    <!-- ===================== AKTUELLES / BLOG ===================== -->
    <div class="admin-panel" id="panel-blog">
      <div class="admin-formular">
        <h3 id="beitrag-formular-titel">Neuer Beitrag</h3>
        <input type="hidden" id="beitrag-id">
        <label for="beitrag-titel">Titel</label>
        <input type="text" id="beitrag-titel" required>
        <label for="beitrag-slug">Slug (für die URL)</label>
        <input type="text" id="beitrag-slug" required>
        <label for="beitrag-datum">Datum</label>
        <input type="text" id="beitrag-datum" placeholder="JJJJ-MM-TT" required>
        <label for="beitrag-teaser">Teaser (kurze Anreißer-Zeile)</label>
        <textarea id="beitrag-teaser"></textarea>
        <label for="beitrag-inhalt">Inhalt (Absätze durch eine Leerzeile trennen)</label>
        <textarea id="beitrag-inhalt" style="min-height:220px;"></textarea>
        <label for="beitrag-bild">Bild</label>
        <input type="file" id="beitrag-bild" accept="image/*">
        <label for="beitrag-dokument">Dokument (PDF, Word, ...)</label>
        <input type="file" id="beitrag-dokument" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <div class="feld-checkbox">
          <input type="checkbox" id="beitrag-veroeffentlicht" checked>
          <label for="beitrag-veroeffentlicht" style="margin:0;">Veröffentlicht</label>
        </div>
        <div class="knopf-zeile">
          <button class="knopf" id="beitrag-speichern">Speichern</button>
          <button class="knopf leer" id="beitrag-abbrechen" style="display:none;">Abbrechen</button>
        </div>
        <div class="status-meldung" id="beitrag-status"></div>
      </div>
      <ul class="admin-liste" id="beitrag-admin-liste"></ul>
    </div>

    <!-- ===================== MITGLIEDER ===================== -->
    <div class="admin-panel" id="panel-mitglieder">
      <div class="admin-formular">
        <h3 id="mitglied-formular-titel">Neues Mitglied</h3>
        <input type="hidden" id="mitglied-id">
        <label for="mitglied-name">Name</label>
        <input type="text" id="mitglied-name" required>
        <label for="mitglied-slug">Slug (für die URL)</label>
        <input type="text" id="mitglied-slug" required>
        <label for="mitglied-funktion">Funktion in der Partei</label>
        <input type="text" id="mitglied-funktion" placeholder="z. B. Gründer, Schatzmeisterin, Beisitzer">
        <label for="mitglied-kurztext">Kurztext (zwei Sätze für die Übersicht)</label>
        <textarea id="mitglied-kurztext"></textarea>
        <label for="mitglied-lebenslauf">Lebenslauf / Werdegang (Absätze durch Leerzeile trennen)</label>
        <textarea id="mitglied-lebenslauf" style="min-height:180px;"></textarea>
        <label for="mitglied-statement">Statement (ein paar Worte zur Partei, als Zitat)</label>
        <textarea id="mitglied-statement"></textarea>
        <label for="mitglied-bild">Foto</label>
        <input type="file" id="mitglied-bild" accept="image/*">
        <label for="mitglied-reihenfolge">Reihenfolge</label>
        <input type="number" id="mitglied-reihenfolge" value="0">
        <div class="feld-checkbox">
          <input type="checkbox" id="mitglied-veroeffentlicht" checked>
          <label for="mitglied-veroeffentlicht" style="margin:0;">Veröffentlicht</label>
        </div>
        <div class="knopf-zeile">
          <button class="knopf" id="mitglied-speichern">Speichern</button>
          <button class="knopf leer" id="mitglied-abbrechen" style="display:none;">Abbrechen</button>
        </div>
        <div class="status-meldung" id="mitglied-status"></div>
      </div>
      <ul class="admin-liste" id="mitglied-liste"></ul>
    </div>

    <!-- ===================== KENNZAHLEN ===================== -->
    <div class="admin-panel" id="panel-kennzahlen">
      <div class="admin-formular">
        <h3 id="kennzahl-formular-titel">Neue Kennzahl</h3>
        <input type="hidden" id="kennzahl-id">
        <label for="kennzahl-label">Bezeichnung</label>
        <input type="text" id="kennzahl-label" placeholder="z. B. Mitgliederanzahl">
        <label for="kennzahl-wert">Wert (frei formatierbar)</label>
        <input type="text" id="kennzahl-wert" placeholder="z. B. 42 oder 35 % oder 12.480 €">
        <label for="kennzahl-reihenfolge">Reihenfolge</label>
        <input type="number" id="kennzahl-reihenfolge" value="0">
        <div class="feld-checkbox">
          <input type="checkbox" id="kennzahl-veroeffentlicht" checked>
          <label for="kennzahl-veroeffentlicht" style="margin:0;">Veröffentlicht</label>
        </div>
        <div class="knopf-zeile">
          <button class="knopf" id="kennzahl-speichern">Speichern</button>
          <button class="knopf leer" id="kennzahl-abbrechen" style="display:none;">Abbrechen</button>
        </div>
        <div class="status-meldung" id="kennzahl-status"></div>
      </div>
      <ul class="admin-liste" id="kennzahl-liste"></ul>
    </div>
  </section>
</main>

<footer class="fuss">
  <div class="container">
    <div class="fuss-zeile">
      <span>© 2026 TMP — Tommy Möller Partei</span>
      <span>Erkner, Brandenburg</span>
    </div>
  </div>
</footer>

<script>
/* ---------- Hilfsfunktionen ---------- */
function escapeHtml(text){
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function slugify(text){
  return (text || "").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

async function bildHochladen(dateiInput, ordner){
  return dateiHochladen(dateiInput, ordner, "bilder");
}

async function dokumentHochladen(dateiInput, ordner){
  return dateiHochladen(dateiInput, ordner, "dokumente");
}

async function dateiHochladen(dateiInput, ordner, bucket){
  const datei = dateiInput.files[0];
  if (!datei) return null;
  const pfad = `${ordner}/${Date.now()}-${datei.name.replace(/[^a-zA-Z0-9.\-_]/g,"_")}`;
  const { error } = await tmpSupabase.storage.from(bucket).upload(pfad, datei, { upsert: true });
  if (error){
    console.error(error);
    throw new Error("Datei-Upload fehlgeschlagen: " + error.message);
  }
  return pfad;
}

/* ---------- Login / Session ---------- */
const loginFormular = document.getElementById("login-formular");
const loginBereich = document.getElementById("login-bereich");
const adminBereich = document.getElementById("admin-bereich");

async function sessionPruefen(){
  const { data } = await tmpSupabase.auth.getSession();
  if (data.session){
    loginBereich.style.display = "none";
    adminBereich.style.display = "block";
    alleListenLaden();
  } else {
    loginBereich.style.display = "block";
    adminBereich.style.display = "none";
  }
}

loginFormular.addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("login-status");
  status.textContent = "Anmeldung läuft …";
  status.className = "status-meldung";

  const email = document.getElementById("login-email").value.trim();
  const passwort = document.getElementById("login-passwort").value;

  const { error } = await tmpSupabase.auth.signInWithPassword({ email, password: passwort });

  if (error){
    status.textContent = "Anmeldung fehlgeschlagen: " + error.message;
    status.className = "status-meldung fehler";
    return;
  }

  status.textContent = "";
  sessionPruefen();
});

document.getElementById("logout-knopf").addEventListener("click", async () => {
  await tmpSupabase.auth.signOut();
  sessionPruefen();
});

/* ---------- Tabs ---------- */
document.querySelectorAll(".admin-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".admin-tabs button").forEach(b => b.classList.remove("aktiv"));
    document.querySelectorAll(".admin-panel").forEach(p => p.classList.remove("aktiv"));
    btn.classList.add("aktiv");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("aktiv");
  });
});

function alleListenLaden(){
  produkteAdminLaden();
  hauptpunkteAdminLaden();
  beitraegeAdminLaden();
  mitgliederAdminLaden();
  kennzahlenAdminLaden();
}

/* ================= SHOP-PRODUKTE ================= */
async function produkteAdminLaden(){
  const liste = document.getElementById("produkt-liste");
  const { data, error } = await tmpSupabase.from("shop_produkte").select("*").order("reihenfolge");
  if (error){ liste.innerHTML = "<li>Fehler beim Laden.</li>"; return; }

  liste.innerHTML = (data || []).map(p => `
    <li class="admin-eintrag">
      ${p.bild_url ? `<img src="${tmpBildUrl(p.bild_url)}" alt="">` : ""}
      <div class="details">
        <strong>${escapeHtml(p.name)} ${p.aktiv ? "" : "(ausgeblendet)"}</strong>
        <span>${Number(p.preis).toFixed(2)} € · Reihenfolge ${p.reihenfolge}</span>
      </div>
      <div class="aktionen">
        <button onclick="produktBearbeiten('${p.id}')">Bearbeiten</button>
        <button class="loeschen" onclick="produktLoeschen('${p.id}')">Löschen</button>
      </div>
    </li>
  `).join("") || "<li>Noch keine Produkte angelegt.</li>";
}

let produktCache = [];
async function produktBearbeiten(id){
  const { data } = await tmpSupabase.from("shop_produkte").select("*").eq("id", id).single();
  if (!data) return;
  document.getElementById("produkt-formular-titel").textContent = "Produkt bearbeiten";
  document.getElementById("produkt-id").value = data.id;
  document.getElementById("produkt-name").value = data.name;
  document.getElementById("produkt-beschreibung").value = data.beschreibung || "";
  document.getElementById("produkt-preis").value = data.preis;
  document.getElementById("produkt-reihenfolge").value = data.reihenfolge;
  document.getElementById("produkt-aktiv").checked = data.aktiv;
  document.getElementById("produkt-abbrechen").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("produkt-abbrechen").addEventListener("click", () => produktFormularZuruecksetzen());

function produktFormularZuruecksetzen(){
  document.getElementById("produkt-formular-titel").textContent = "Neues Produkt";
  document.getElementById("produkt-id").value = "";
  document.getElementById("produkt-name").value = "";
  document.getElementById("produkt-beschreibung").value = "";
  document.getElementById("produkt-preis").value = "";
  document.getElementById("produkt-bild").value = "";
  document.getElementById("produkt-reihenfolge").value = "0";
  document.getElementById("produkt-aktiv").checked = true;
  document.getElementById("produkt-abbrechen").style.display = "none";
}

document.getElementById("produkt-speichern").addEventListener("click", async (e) => {
  e.preventDefault();
  const status = document.getElementById("produkt-status");
  status.textContent = "Speichern …";
  status.className = "status-meldung";

  try {
    const id = document.getElementById("produkt-id").value;
    const eintrag = {
      name: document.getElementById("produkt-name").value.trim(),
      beschreibung: document.getElementById("produkt-beschreibung").value.trim(),
      preis: parseFloat(document.getElementById("produkt-preis").value) || 0,
      reihenfolge: parseInt(document.getElementById("produkt-reihenfolge").value) || 0,
      aktiv: document.getElementById("produkt-aktiv").checked
    };

    const bildPfad = await bildHochladen(document.getElementById("produkt-bild"), "produkte");
    if (bildPfad) eintrag.bild_url = bildPfad;

    let fehler;
    if (id){
      ({ error: fehler } = await tmpSupabase.from("shop_produkte").update(eintrag).eq("id", id));
    } else {
      ({ error: fehler } = await tmpSupabase.from("shop_produkte").insert(eintrag));
    }
    if (fehler) throw fehler;

    status.textContent = "Gespeichert.";
    status.className = "status-meldung erfolg";
    produktFormularZuruecksetzen();
    produkteAdminLaden();
  } catch (err){
    status.textContent = "Fehler: " + err.message;
    status.className = "status-meldung fehler";
  }
});

async function produktLoeschen(id){
  if (!confirm("Dieses Produkt wirklich löschen?")) return;
  await tmpSupabase.from("shop_produkte").delete().eq("id", id);
  produkteAdminLaden();
}

/* ================= THEMEN: HAUPTPUNKTE ================= */
async function hauptpunkteAdminLaden(){
  const liste = document.getElementById("hauptpunkt-liste");
  const { data, error } = await tmpSupabase.from("themen_hauptpunkte").select("*").order("reihenfolge");
  if (error){ liste.innerHTML = "<li>Fehler beim Laden.</li>"; return; }

  liste.innerHTML = (data || []).map(h => `
    <li class="admin-eintrag" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;gap:16px;align-items:flex-start;">
        ${h.bild_url ? `<img src="${tmpBildUrl(h.bild_url)}" alt="">` : ""}
        <div class="details">
          <strong>${escapeHtml(h.titel)} ${h.veroeffentlicht ? "" : "(unveröffentlicht)"} ${h.dokument_url ? "📄" : ""}</strong>
          <span>/thema.html?slug=${escapeHtml(h.slug)}</span>
        </div>
        <div class="aktionen">
          <button onclick="hauptpunktBearbeiten('${h.id}')">Bearbeiten</button>
          <button class="loeschen" onclick="hauptpunktLoeschen('${h.id}')">Löschen</button>
        </div>
      </div>
      <div class="admin-unterliste" id="artikel-liste-${h.id}">
        <p class="lade-hinweis">Artikel werden geladen …</p>
      </div>
      <div class="admin-formular" style="margin-top:14px;">
        <h3 style="font-size:16px;">Artikel zu „${escapeHtml(h.titel)}" hinzufügen</h3>
        <input type="hidden" class="artikel-hauptpunkt-id" value="${h.id}">
        <input type="hidden" class="artikel-id">
        <label>Titel</label>
        <input type="text" class="artikel-titel">
        <label>Inhalt (Absätze durch Leerzeile trennen)</label>
        <textarea class="artikel-inhalt" style="min-height:140px;"></textarea>
        <label>Bild</label>
        <input type="file" class="artikel-bild" accept="image/*">
        <label>Dokument (PDF, Word, ...)</label>
        <input type="file" class="artikel-dokument" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <label>Reihenfolge</label>
        <input type="number" class="artikel-reihenfolge" value="0">
        <div class="knopf-zeile">
          <button class="knopf artikel-speichern">Artikel speichern</button>
          <button class="knopf leer artikel-abbrechen" style="display:none;">Abbrechen</button>
        </div>
        <div class="status-meldung artikel-status"></div>
      </div>
    </li>
  `).join("") || "<li>Noch keine Hauptpunkte angelegt.</li>";

  (data || []).forEach(h => artikelAdminLaden(h.id));
}

async function artikelAdminLaden(hauptpunktId){
  const ziel = document.getElementById("artikel-liste-" + hauptpunktId);
  const { data, error } = await tmpSupabase.from("themen_artikel")
    .select("*").eq("hauptpunkt_id", hauptpunktId).order("reihenfolge");

  if (error){ ziel.innerHTML = "Fehler beim Laden der Artikel."; return; }

  if (!data || data.length === 0){
    ziel.innerHTML = '<p class="lade-hinweis">Noch keine Artikel zu diesem Thema.</p>';
  } else {
    ziel.innerHTML = data.map(a => `
      <div class="admin-eintrag">
        ${a.bild_url ? `<img src="${tmpBildUrl(a.bild_url)}" alt="">` : ""}
        <div class="details">
          <strong>${escapeHtml(a.titel)} ${a.veroeffentlicht ? "" : "(unveröffentlicht)"} ${a.dokument_url ? "📄" : ""}</strong>
        </div>
        <div class="aktionen">
          <button onclick="artikelBearbeiten('${hauptpunktId}', '${a.id}')">Bearbeiten</button>
          <button class="loeschen" onclick="artikelLoeschen('${a.id}', '${hauptpunktId}')">Löschen</button>
        </div>
      </div>
    `).join("");
  }

  const formular = document.querySelector(`#artikel-liste-${hauptpunktId}`).closest("li").querySelector(".admin-formular");
  formular.querySelector(".artikel-speichern").onclick = async (e) => {
    e.preventDefault();
    const status = formular.querySelector(".artikel-status");
    status.textContent = "Speichern …";
    status.className = "status-meldung artikel-status";
    try {
      const artikelId = formular.querySelector(".artikel-id").value;
      const eintrag = {
        hauptpunkt_id: hauptpunktId,
        titel: formular.querySelector(".artikel-titel").value.trim(),
        inhalt: formular.querySelector(".artikel-inhalt").value.trim(),
        reihenfolge: parseInt(formular.querySelector(".artikel-reihenfolge").value) || 0,
        veroeffentlicht: true
      };
      const bildPfad = await bildHochladen(formular.querySelector(".artikel-bild"), "artikel");
      if (bildPfad) eintrag.bild_url = bildPfad;

      const dokumentPfad = await dokumentHochladen(formular.querySelector(".artikel-dokument"), "artikel");
      if (dokumentPfad) eintrag.dokument_url = dokumentPfad;

      let fehler;
      if (artikelId){
        ({ error: fehler } = await tmpSupabase.from("themen_artikel").update(eintrag).eq("id", artikelId));
      } else {
        ({ error: fehler } = await tmpSupabase.from("themen_artikel").insert(eintrag));
      }
      if (fehler) throw fehler;

      status.textContent = "Gespeichert.";
      status.className = "status-meldung erfolg";
      formular.querySelector(".artikel-id").value = "";
      formular.querySelector(".artikel-titel").value = "";
      formular.querySelector(".artikel-inhalt").value = "";
