<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="seiten-titel">Thema — TMP</title>
<meta name="description" content="Hintergründe und Artikel zu einem Wahlprogrammpunkt von TMP.">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<header class="kopf">
  <div class="container">
    <a class="wortmarke" href="index.html"><span class="paragraf">§</span> TMP <small>Tommy Möller Partei</small></a>
    <nav class="hauptnav" aria-label="Hauptnavigation">
      <ul>
        <li><a href="index.html">Start</a></li>
        <li><a href="ueber-uns.html">Über uns</a></li>
        <li><a href="themen.html" aria-current="page">Themen</a></li>
        <li><a href="aktuelles.html">Aktuelles</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="mitglied-werden.html">Mitglied werden</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="abschnitt" id="inhalt">
    <p class="lade-hinweis">Wird geladen …</p>
  </section>
</main>

<footer class="fuss">
  <div class="container">
    <div class="fuss-zeile">
      <span>© 2026 TMP — Tommy Möller Partei</span>
      <span>Erkner, Brandenburg</span>
    </div>
    <nav aria-label="Rechtliches">
      <ul>
        <li><a href="impressum.html">Impressum</a></li>
        <li><a href="datenschutz.html">Datenschutz</a></li>
        <li class="fuss-admin-link"><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
  </div>
</footer>

<script>
function escapeHtml(text){
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function alsAbsaetze(text){
  return (text || "").split(/\n\s*\n/).map(p => `<p>${escapeHtml(p)}</p>`).join("");
}

async function themaLaden(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const inhalt = document.getElementById("inhalt");

  if (!slug){
    inhalt.innerHTML = '<p class="lade-hinweis">Kein Thema angegeben.</p>';
    return;
  }

  const { data: hauptpunkt, error: fehlerHauptpunkt } = await tmpSupabase
    .from("themen_hauptpunkte")
    .select("*")
    .eq("slug", slug)
    .eq("veroeffentlicht", true)
    .single();

  if (fehlerHauptpunkt || !hauptpunkt){
    inhalt.innerHTML = '<p class="lade-hinweis">Dieses Thema wurde nicht gefunden.</p><a class="zurueck-link" href="themen.html">← Zurück zu Themen</a>';
    return;
  }

  document.getElementById("seiten-titel").textContent = hauptpunkt.titel + " — TMP";

  const { data: artikel, error: fehlerArtikel } = await tmpSupabase
    .from("themen_artikel")
    .select("*")
    .eq("hauptpunkt_id", hauptpunkt.id)
    .eq("veroeffentlicht", true)
    .order("reihenfolge", { ascending: true });

  let artikelHtml = '<p class="lade-hinweis">Zu diesem Thema sind noch keine Artikel veröffentlicht.</p>';

  if (!fehlerArtikel && artikel && artikel.length > 0){
    artikelHtml = artikel.map(a => `
      <article class="artikel-karte">
        <h3>${escapeHtml(a.titel)}</h3>
        ${a.bild_url ? `<img src="${tmpBildUrl(a.bild_url)}" alt="${escapeHtml(a.titel)}">` : ""}
        <div class="inhalt">${alsAbsaetze(a.inhalt)}</div>
      </article>
    `).join("");
  }

  inhalt.innerHTML = `
    <h2>${escapeHtml(hauptpunkt.titel)}</h2>
    <p>${escapeHtml(hauptpunkt.kurztext || "")}</p>
    ${hauptpunkt.bild_url ? `<img src="${tmpBildUrl(hauptpunkt.bild_url)}" alt="${escapeHtml(hauptpunkt.titel)}" style="max-width:100%;height:auto;border:1px solid var(--linie);margin:20px 0;">` : ""}
    <h3 style="margin-top:36px;">Artikel zu diesem Thema</h3>
    ${artikelHtml}
    <a class="zurueck-link" href="themen.html">← Zurück zu Themen</a>
  `;
}

themaLaden();
</script>

</body>
</html>
